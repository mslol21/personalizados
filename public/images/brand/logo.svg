<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="40%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#C59E3F" />
      <stop offset="100%" stop-color="#8C6527" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59E3F" />
      <stop offset="100%" stop-color="#7A5617" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8C6527" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark (Monogram Badge) -->
  <g transform="translate(10, 10)">
    <!-- Outer Elegant Circle -->
    <circle cx="50" cy="50" r="46" fill="#FAF8F5" stroke="url(#goldGradient)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldBorder)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
    
    <!-- Monogram CA -->
    <text x="32" y="62" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="44" font-weight="700" fill="url(#goldGradient)" filter="url(#softGlow)">C</text>
    <text x="50" y="65" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="40" font-style="italic" font-weight="600" fill="url(#goldGradient)">A</text>
    
    <!-- Decorative Stars/Sparkles -->
    <path d="M50 14 L52 20 L58 22 L52 24 L50 30 L48 24 L42 22 L48 20 Z" fill="url(#goldGradient)" />
    <path d="M50 72 L51.5 76 L55 77 L51.5 78 L50 82 L48.5 78 L45 77 L48.5 76 Z" fill="url(#goldGradient)" opacity="0.8" />
  </g>

  <!-- Main Brand Typography -->
  <g transform="translate(125, 20)">
    <!-- Primary Name -->
    <text x="0" y="42" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="1.5" fill="#1C1E21">
      CRIATIVO <tspan fill="url(#goldGradient)">ARTES</tspan>
    </text>
    
    <!-- Subtitle / Commercial Name -->
    <text x="2" y="68" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#A6802C">
      PERSONALIZADOS
    </text>
    <text x="180" y="68" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" letter-spacing="2" fill="#6B7280">
      • BRINDES &amp; PRESENTES
    </text>
    
    <!-- Thin decorative line -->
    <line x1="2" y1="78" x2="390" y2="78" stroke="url(#goldGradient)" stroke-width="1" opacity="0.4" />
  </g>
</svg>
